name: Сборка CloudMount.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        run: python -m pytest -q tests

      - name: Сборка exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole
          --name CloudMount --icon assets/icon.ico --add-data "assets;assets"
          --hidden-import pystray._win32 --hidden-import mfusepy
          --collect-submodules cloudmount main.py

      - uses: actions/upload-artifact@v4
        with:
          name: CloudMount
          path: dist/CloudMount.exe

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CloudMount.exe
          generate_release_notes: true
