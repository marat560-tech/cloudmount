name: Сборка CloudMount.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        run: python -m pytest -q tests

      - name: Сборка exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole
          --name CloudMount --icon assets/icon.ico --add-data "assets;assets"
          --hidden-import pystray._win32 --hidden-import mfusepy
          --collect-submodules cloudmount main.py

      - uses: actions/upload-artifact@v4
        with:
          name: CloudMount
          path: dist/CloudMount.exe

      - name: Релиз (новая версия из cloudmount/__init__.py)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python -c "import cloudmount; print(cloudmount.__version__)")
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Релиз v$VER уже есть — пропускаю"
          else
            gh release create "v$VER" dist/CloudMount.exe --target "$GITHUB_SHA" \
              --title "CloudMount $VER" --generate-notes
          fi
